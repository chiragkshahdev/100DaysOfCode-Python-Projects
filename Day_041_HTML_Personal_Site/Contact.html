<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Me</title>
    <style>
        body {
            background-color: #EAF6F6;
            font-family: Arial, sans-serif;
            color: #40514E;
            text-align: center;
            margin: 0;
            padding-top: 30px;
        }
        h1 {
            color: #66BFBF;
            font-size: 38px;
        }
        p {
            line-height: 1.6;
        }
        hr {
            border: dotted #A0D8D8 6px;
            border-bottom: none;
            width: 5%;
            margin: 30px auto;
        }
        form {
            display: inline-block;
            text-align: left;
            background-color: white;
            padding: 25px 30px;
            border-radius: 12px;
        }
        label {
            font-weight: bold;
            color: #11999E;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin: 8px 0 15px 0;
            border: 1px solid #A0D8D8;
            border-radius: 6px;
            font-size: 14px;
        }
        input[type="submit"] {
            background-color: #11999E;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        input[type="submit"]:hover {
            background-color: #66BFBF;
        }
        a {
            color: #11999E;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            color: #66BFBF;
        }
    </style>
</head>
<body>
    <h1>My Contact Details</h1>
    <p>Virar, Maharashtra, India</p>
    <p>your.email@gmail.com</p>
    <p>9876543210</p>

    <hr>

    <form action="mailto:your.email@gmail.com" method="post">
        <label>Your Name:</label><br>
        <input type="text" name="yourName"><br>

        <label>Your Email:</label><br>
        <input type="email" name="yourEmail"><br>

        <label>Your Message:</label><br>
        <textarea name="yourMessage" rows="5" cols="30"></textarea><br>

        <input type="submit" value="Send">
    </form>

    <br><br>
    <a href="index.html">Back to Home</a>
</body>
</html>
