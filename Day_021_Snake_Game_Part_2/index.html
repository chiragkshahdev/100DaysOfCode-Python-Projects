<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 21 - Snake Game Part 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>🐍 Snake Game - Day 21</h1>
    <div class="score-board">
      <span>Score: <b id="score">0</b></span>
      <span>High Score: <b id="highScore">0</b></span>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls">
      <button onclick="changeDirection('up')">↑</button>
      <div>
        <button onclick="changeDirection('left')">←</button>
        <button onclick="changeDirection('down')">↓</button>
        <button onclick="changeDirection('right')">→</button>
      </div>
    </div>
    <p class="hint">PC: Arrow Keys | Mobile: Buttons</p>
  </div>

  <div id="gameOverModal" class="modal hidden">
    <div class="modal-content">
      <h2>Game Over! 💀</h2>
      <p>Your Score: <span id="finalScore">0</span></p>
      <button onclick="restartGame()">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
