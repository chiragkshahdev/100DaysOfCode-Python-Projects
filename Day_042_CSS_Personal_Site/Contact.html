<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Your Name</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container nav">
            <a href="index.html" class="logo">✦ YourName</a>
            <a href="index.html" class="btn-nav">← Back Home</a>
        </div>
    </header>

    <div class="contact-wrap">
        <div class="contact-card">
            <h1>Let's Talk 💬</h1>
            <p>Virar, Maharashtra • your.email@gmail.com</p>
            <form>
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea rows="4" placeholder="Tell me about your project..."></textarea>
                <button class="btn-black" style="width:100%; border:none; cursor:pointer;">Send Message →</button>
            </form>
        </div>
    </div>
</body>
</html>
